{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ url_for('static', filename=product.image) }}" class="img-fluid rounded" alt="{{ product.name }}">
        </div>
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p class="text-muted">Ürün Kodu: TS{{ product.id }}</p>
            <hr>
            <h4>Fiyat: {{ product.price }} TL</h4>
            <p>{{ product.description }}</p>

            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg">
                    <i class="fas fa-cart-plus me-2"></i>Sepete Ekle
                </button>
                <button class="btn btn-outline-secondary btn-lg">
                    <i class="fas fa-heart me-2"></i>Favorilere Ekle
                </button>
            </div>
        </div>
    </div>
    <a href="{{ url_for('recommend_similar') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-thumbs-up me-2"></i>Benzer Ürünleri Listele
    </a>
</div>
{% endblock %}
