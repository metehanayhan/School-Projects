{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Önerilen Ürünler</h1>
    <div class="row">
        {% for product in similar_products %}
        <div class="col-md-3 mb-3">
            <div class="card">
                <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p class="card-text"><small class="text-muted">{{ product.price }} TL</small></p>
                    <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-primary">Sepete Ekle</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
