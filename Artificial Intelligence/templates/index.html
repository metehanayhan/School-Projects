{% extends "base.html" %}

{% block content %}
<div class="container">
    <div id="carouselExampleIndicators" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{{ url_for('static', filename='images/slider1.jpg') }}" class="d-block w-100" alt="Slider 1">
            </div>
            <div class="carousel-item">
                <img src="{{ url_for('static', filename='images/slider2.jpg') }}" class="d-block w-100" alt="Slider 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="alert alert-info" role="alert">
                <h4 class="alert-heading">Günün Fırsatları!</h4>
                <p>Kaçırılmayacak indirimlerle en iyi ürünler burada!</p>
            </div>
        </div>
    </div>

    <h3 class="mb-3">Öne Çıkan Ürünler</h3>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <img src="{{ url_for('static', filename=product.image.split('static/')[-1]) }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <div class="mb-3">
                        <span class="text-muted">{{ product.price }} TL</span>
                    </div>
                    <p class="card-text">{{ product.description|truncate(50) }}</p>
                    <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-outline-primary">
                        <i class="fas fa-eye me-2"></i>İncele
                    </a>
                    <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-primary float-end">
                        <i class="fas fa-cart-plus me-2"></i>Sepete Ekle
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
